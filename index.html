<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PROJECT ARCHIVE // CLASSIFIED</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #07090e;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .scanner-line {
      width: 220px;
      height: 3px;
      background: #00ffcc;
      box-shadow: 0 0 16px #00ffcc, 0 0 30px #00ffcc;
      animation: scan 1.2s infinite alternate ease-in-out;
    }
    @keyframes scan {
      0% { transform: translateY(-40px); opacity: 0.4; }
      100% { transform: translateY(40px); opacity: 1; }
    }
    .loading-status {
      margin-top: 30px;
      font-family: monospace;
      font-size: 13px;
      color: #00ffcc;
      letter-spacing: 3px;
    }
    .wrapper {
      max-width: 520px;
      width: 100%;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(48, 54, 61, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 204, 0.05);
    }
    .badge-warn {
      display: inline-block;
      padding: 5px 14px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
      font-family: monospace;
    }
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
    }
    .avatar-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #00ffcc;
      background: #0d1117;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-panel {
      text-align: left;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.9;
    }
    .status-panel div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(48, 54, 61, 0.4);
      padding: 4px 0;
    }
    .status-panel div:last-child {
      border-bottom: none;
    }
    .panel-label {
      color: #8b949e;
    }
    .panel-value {
      font-weight: 600;
      color: #f0f6fc;
    }
    .escape-box {
      position: relative;
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .btn-run {
      background: #238636;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }
    .btn-reveal {
      width: 100%;
      background: transparent;
      color: #00ffcc;
      font-weight: 600;
      font-size: 13px;
      padding: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-reveal:hover {
      background: rgba(0, 255, 204, 0.08);
      border-color: #00ffcc;
    }
    #reveal-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reveal-card {
      background: #ffffff;
      color: #0d1117;
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .reveal-card h2 {
      font-size: 26px;
      font-weight: 900;
      color: #da3633;
      margin-bottom: 12px;
    }
    .reveal-card p {
      font-size: 14px;
      line-height: 1.7;
      color: #24292f;
      margin-bottom: 24px;
    }
    .btn-close {
      background: #0969da;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="scanner-line"></div>
    <div class="loading-status">IDENTIFYING TARGET...</div>
  </div>

  <div class="wrapper">
    <div class="badge-warn">TOP SECRET</div>
    <h1>極秘観測対象 記録アーカイブ</h1>
    <p class="subtitle">ID: TRG-2026-X99 // LEVEL 4 CLEARANCE</p>

    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <span id="target-icon">👤</span>
      </div>
    </div>

    <div class="status-panel">
      <div>
        <span class="panel-label">指定呼称</span>
        <span class="panel-value">伝説の男（友達の名前）</span>
      </div>
      <div>
        <span class="panel-label">危険度</span>
        <span class="panel-value">★☆☆☆☆ (無害)</span>
      </div>
      <div>
        <span class="panel-label">主たる特異点</span>
        <span class="panel-value">突然の寝落ち / 謎の行動力</span>
      </div>
      <div>
        <span class="panel-label">直近の観測場所</span>
        <span class="panel-value">近所のコンビニ</span>
      </div>
      <div>
        <span class="panel-label">弱点</span>
        <span class="panel-value">奢りジャンケン / 朝の目覚まし</span>
      </div>
    </div>

    <div class="escape-box">
      <button class="btn-run" id="btn-escape">ファンクラブに入会する</button>
    </div>

    <button class="btn-reveal" onclick="showTruth()">真実を確認する</button>
  </div>

  <div id="reveal-modal">
    <div class="reveal-card">
      <h2>ドッキリ大成功！</h2>
      <p>
        驚かせてごめん！<br>
        このサイトはあなたのために作られた特設ページです。<br>
        いつもありがとう！
      </p>
      <button class="btn-close" onclick="closeTruth()">閉じる</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        overlay.style.visibility = 'hidden';
      }, 1400);
    });

    const runBtn = document.getElementById('btn-escape');
    runBtn.addEventListener('mouseenter', dodge);
    runBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dodge();
    });

    function dodge() {
      const box = runBtn.parentElement;
      const maxX = (box.clientWidth - runBtn.clientWidth) / 2;
      const maxY = (box.clientHeight - runBtn.clientHeight) / 2;
      const nextX = (Math.random() * 2 - 1) * maxX;
      const nextY = (Math.random() * 2 - 1) * maxY;
      runBtn.style.transform = `translate(${nextX}px, ${nextY}px)`;
    }

    function showTruth() {
      const modal = document.getElementById('reveal-modal');
      modal.style.display = 'flex';
      confetti({
        particleCount: 160,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    function closeTruth() {
      document.getElementById('reveal-modal').style.display = 'none';
    }
  </script>
</body>
</html>
