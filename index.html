<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>道下ファンクラブ 公式サイト</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background-color: #f7f9fa;
      color: #333333;
      padding-bottom: 60px;
    }

    header {
      background: #ffffff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eef0f2;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 800;
      color: #2b2b2b;
      letter-spacing: -0.5px;
    }
    .logo-mark {
      color: #f05a28;
      font-size: 20px;
      font-weight: 900;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: -0.5px;
      background: rgba(240, 90, 40, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .hamburger span {
      width: 26px;
      height: 3px;
      background: #f05a28;
      border-radius: 2px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 15px rgba(0,0,0,0.04);
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 180px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .badge-campaign {
      position: absolute;
      top: 18px;
      left: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .badge-red {
      background: #e53e3e;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .badge-white {
      background: rgba(255, 255, 255, 0.95);
      color: #1a202c;
      font-size: 17px;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 16px 0 24px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .dot.active {
      background: #f05a28;
    }

    .copy-section {
      text-align: center;
      padding: 0 20px 24px;
    }
    .copy-main {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 10px;
      color: #222222;
    }
    .copy-main .highlight {
      color: #f05a28;
    }
    .copy-sub {
      font-size: 13.5px;
      color: #64748b;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      padding: 0 10px;
    }
    .btn {
      flex: 1;
      height: 48px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-primary {
      background: #f05a28;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(240, 90, 40, 0.35);
    }
    .btn-outline {
      background: #ffffff;
      color: #f05a28;
      border: 2px solid #f05a28;
    }
    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .gallery-section {
      padding: 10px 20px 40px;
    }
    .section-title {
      font-size: 21px;
      font-weight: 900;
      color: #222222;
      margin-bottom: 18px;
      display: inline-block;
      position: relative;
    }
    .section-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 4px;
      background: #f05a28;
      border-radius: 2px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 14px;
    }
    .photo-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .photo-frame {
      width: 100%;
      height: 115px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e8f0;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-desc {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #2d3748;
    }

    #reveal-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reveal-content {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .reveal-title {
      font-size: 24px;
      font-weight: 900;
      color: #f05a28;
      margin-bottom: 12px;
    }
    .reveal-desc {
      font-size: 14.5px;
      line-height: 1.65;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .btn-modal-close {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 24px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-logo">
        <span class="logo-mark">MI</span>
        <span>道下ファンクラブ</span>
      </div>
      <div class="hamburger" onclick="showJoke()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <div class="hero-banner">
      <img src="banner.jpg" onerror="this.src='m2.jpg'" alt="キャンペーンバナー">
      <div class="badge-campaign">
        <span class="badge-red">おためし</span>
        <span class="badge-white">キャンペーン実施中</span>
      </div>
    </div>

    <div class="slider-dots">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>

    <div class="copy-section">
      <div class="copy-main">
        未来ある<br>
        <span class="highlight">道下の一歩</span>に。
      </div>
      <p class="copy-sub">道下に出来ることなら誰でも出来る。</p>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="showJoke()">ログイン</button>
        <button class="btn btn-outline" onclick="showJoke()">会員登録</button>
      </div>
    </div>

    <div class="gallery-section">
      <div class="section-title">道下 life</div>

      <div class="photo-grid">
        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">
            <img src="m1.jpg" alt="文化祭が楽しい道下">
          </div>
          <p class="photo-desc">文化祭が楽しい道下</p>
        </div>

        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">
            <img src="m2.jpg" alt="黒板アートの完成が嬉しい道下">
          </div>
          <p class="photo-desc">黒板アートの完成が嬉しい道下</p>
        </div>

        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">
            <img src="m3.jpg" alt="文化祭が終わってしまい悲しむ道下">
          </div>
          <p class="photo-desc">文化祭が終わってしまい悲しむ道下</p>
        </div>

        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">
            <img src="m4.jpg" alt="文化祭をサボる道下">
          </div>
          <p class="photo-desc">文化祭をサボる道下</p>
        </div>
      </div>
    </div>
  </div>

  <div id="reveal-modal">
    <div class="reveal-content">
      <div class="reveal-title">🎉 ドッキリ大成功！</div>
      <p class="reveal-desc">
        道下ファンクラブ公式特設サイトへようこそ！<br>
        道下お前の方が借り多いけどありがとう
      </p>
      <button class="btn-modal-close" onclick="closeJoke()">閉じる</button>
    </div>
  </div>

  <script>
    function showJoke() {
      document.getElementById('reveal-modal').style.display = 'flex';
      confetti({
        particleCount: 160,
        spread: 85,
        origin: { y: 0.6 }
      });
    }

    function closeJoke() {
      document.getElementById('reveal-modal').style.display = 'none';
    }
  </script>
</body>
</html>
