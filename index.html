<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>〇〇ファンクラブ 公式サイト</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background-color: #f7f9fa;
      color: #333333;
      padding-bottom: 60px;
    }

    /* ヘッダー */
    header {
      background: #ffffff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eef0f2;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 800;
      color: #2b2b2b;
      letter-spacing: -0.5px;
    }
    .logo-mark {
      color: #f05a28;
      font-size: 22px;
      font-weight: 900;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .hamburger span {
      width: 24px;
      height: 3px;
      background: #f05a28;
      border-radius: 2px;
    }

    /* メインコンテナ */
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 15px rgba(0,0,0,0.04);
    }

    /* ヒーロー画像エリア */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 200px;
      background: #e2e8f0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-campaign {
      position: absolute;
      top: 20px;
      left: 15px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .badge-red {
      background: #e53e3e;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .badge-white {
      background: rgba(255, 255, 255, 0.95);
      color: #1a202c;
      font-size: 15px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* インジケーター（ポチポチ） */
    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 24px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .dot.active {
      background: #f05a28;
    }

    /* キャッチコピー */
    .copy-section {
      text-align: center;
      padding: 0 20px 24px;
    }
    .copy-main {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 10px;
      color: #222222;
    }
    .copy-main .highlight {
      color: #f05a28;
    }
    .copy-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
    }

    /* ボタン群 */
    .btn-group {
      display: flex;
      gap: 12px;
      padding: 0 20px 32px;
    }
    .btn {
      flex: 1;
      height: 48px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: #f05a28;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(240, 90, 40, 0.3);
    }
    .btn-outline {
      background: #ffffff;
      color: #f05a28;
      border: 2px solid #f05a28;
    }
    .btn:active {
      opacity: 0.8;
    }

    /* ギャラリーセクション */
    .gallery-section {
      padding: 0 20px 40px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: #222222;
      margin-bottom: 16px;
      display: inline-block;
      position: relative;
    }
    .section-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background: #f05a28;
      border-radius: 2px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
    }
    .photo-card {
      display: flex;
      flex-direction: column;
    }
    .photo-frame {
      width: 100%;
      height: 110px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border: 1px solid #e2e8f0;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-desc {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      color: #334155;
    }

    /* ネタばらしモーダル */
    #reveal-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reveal-content {
      background: #ffffff;
      max-width: 360px;
      width: 100%;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    .reveal-title {
      font-size: 22px;
      font-weight: 800;
      color: #f05a28;
      margin-bottom: 10px;
    }
    .reveal-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 20px;
    }
    .btn-modal-close {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ヘッダー -->
    <header>
      <div class="header-logo">
        <span class="logo-mark">///</span>
        <span>山田ファンクラブ</span> <!-- ★友達の苗字に変える -->
      </div>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <!-- メインビジュアル -->
    <div class="hero-banner">
      <!-- メインの思い出写真などがあればここ -->
      <div class="badge-campaign">
        <span class="badge-red">おためし</span>
        <span class="badge-white">キャンペーン実施中</span>
      </div>
    </div>

    <!-- スライダーのポチ -->
    <div class="slider-dots">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>

    <!-- キャッチコピー -->
    <div class="copy-section">
      <div class="copy-main">
        未来ある<br>
        <span class="highlight">山田の一歩</span>に。 <!-- ★友達の名前に変える -->
      </div>
      <p class="copy-sub">山田に出来ることなら誰でも出来る。</p>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="showJoke()">ログイン</button>
        <button class="btn btn-outline" onclick="showJoke()">会員登録</button>
      </div>
    </div>

    <!-- 友達の写真グリッド（画像と同じレイアウト） -->
    <div class="gallery-section">
      <div class="section-title">山田 life</div>

      <div class="photo-grid">
        <!-- 写真1 -->
        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">📸</div>
          <p class="photo-desc">文化祭が楽しい山田</p>
        </div>
        <!-- 写真2 -->
        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">📸</div>
          <p class="photo-desc">課題の完成が嬉しい山田</p>
        </div>
        <!-- 写真3 -->
        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">📸</div>
          <p class="photo-desc">夏休みが終わってしまい悲しむ山田</p>
        </div>
        <!-- 写真4 -->
        <div class="photo-card" onclick="showJoke()">
          <div class="photo-frame">📸</div>
          <p class="photo-desc">掃除当番をサボる山田</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ネタばらし画面 -->
  <div id="reveal-modal">
    <div class="reveal-content">
      <div class="reveal-title">🎉 ドッキリ大成功！</div>
      <p class="reveal-desc">
        公式ファンクラブは真っ赤な嘘です！<br>
        いつも笑わせてくれてありがとう！
      </p>
      <button class="btn-modal-close" onclick="closeJoke()">閉じる</button>
    </div>
  </div>

  <script>
    function showJoke() {
      document.getElementById('reveal-modal').style.display = 'flex';
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    function closeJoke() {
      document.getElementById('reveal-modal').style.display = 'none';
    }
  </script>
</body>
</html>
